# Prod-only HTTPS enforcement.
#
# dj_nginx serves dev over plain HTTP on :81 — `forced_ssl` would redirect to a
# non-existent HTTPS endpoint (ERR_SSL_PROTOCOL_ERROR). The CSP itself lives in
# config/packages/nelmio_security.yaml and applies in every environment, so a
# missing nonce breaks the page in dev instead of only in production.
nelmio_security:
    # Force HTTPS for one year. Subdomains included. Preload disabled until
    # the domain is registered with hstspreload.org — flipping preload before
    # registration locks the entire org out of HTTP for 6+ months even if the
    # site ever ships without HTTPS.
    forced_ssl:
        enabled: true
        hsts_max_age: 31536000
        hsts_subdomains: true
        hsts_preload: false
