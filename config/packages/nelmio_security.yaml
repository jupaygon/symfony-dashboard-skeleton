nelmio_security:
    # Block framing of the application (clickjacking).
    # Modern browsers honour CSP frame-ancestors (set below). X-Frame-Options
    # is the legacy fallback for older user-agents and is enabled in every env
    # because it does not depend on TLS or nonces.
    clickjacking:
        paths:
            '^/.*': DENY

    # Disable MIME sniffing on responses.
    content_type:
        nosniff: true

    # Strict referrer behaviour.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Content Security Policy, enforced in every environment on purpose: a CSP
    # that only exists in prod is a CSP nobody tests. NelmioSecurityBundle emits
    # a per-response nonce as soon as a template calls `csp_nonce()`, and per
    # spec browsers then IGNORE 'unsafe-inline' — every inline <script> of ours
    # must carry `nonce="{{ csp_nonce('script') }}"` or it dies silently.
    csp:
        enforce:
            level1_fallback: true
            browser_adaptive:
                enabled: false
            default-src:
                - "'self'"
            script-src:
                # 'unsafe-inline' is a no-op for browsers that honour the nonce;
                # it is kept as the CSP level 1 fallback for older user-agents.
                # 'unsafe-eval' is required by Stimulus/Hotwire.
                - "'self'"
                - "'unsafe-inline'"
                - "'unsafe-eval'"
            style-src:
                # EasyAdmin renders a handful of style="..." attributes, which no
                # nonce can cover — dropping 'unsafe-inline' breaks colour and
                # code-editor fields on browsers without the level 1 fallback.
                - "'self'"
                - "'unsafe-inline'"
            img-src:
                - "'self'"
                - 'data:'
            font-src:
                - "'self'"
                - 'data:'
            connect-src:
                - "'self'"
            frame-ancestors:
                - "'none'"
            form-action:
                - "'self'"
            base-uri:
                - "'self'"
            object-src:
                - "'none'"
